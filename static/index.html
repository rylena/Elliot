<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Elliot</title>
  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css" />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css" />
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>

<body>
  <div class="container">
    <div class="terminal-section">
      <div class="terminal-header">
        <div class="terminal-title">Terminal</div>
        <div class="terminal-controls">
          <button class="control-btn" onclick="clearTerminal()" title="Clear Terminal">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2" />
            </svg>
          </button>
          <button class="control-btn" onclick="restartProgram()" title="Restart System">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M23 4v6h-6M1 20v-6h6" />
              <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15" />
            </svg>
          </button>
        </div>
      </div>
      <div class="terminal-container">
        <div id="terminal"></div>
      </div>
    </div>

    <div class="chat-section">
      <div class="chat-header">
        <div class="chat-title">
          <span class="status-dot connected"></span>
          Elliot AI
        </div>
      </div>
      <div class="chat-messages" id="chat-messages">
        <div class="status connecting">Connecting to terminal...</div>
      </div>
      <div class="chat-input-area">
        <div class="chat-input-container">
          <input type="text" id="chat-input" placeholder="Ask Elliot or type a command..." autocomplete="off">
          <button class="send-btn" onclick="sendMessage()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" />
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let socket;
    let terminal;
    let sessionId;
    let fitAddon;
    let clientId;

    function initTerminal() {
      terminal = new Terminal({
        cursorBlink: true,
        fontSize: 14,
        fontFamily: 'Courier New, monospace',
        theme: {
          background: '#0d1117',
          foreground: '#c9d1d9',
          cursor: '#58a6ff',
          selection: '#30363d',
          black: '#0d1117',
          red: '#f85149',
          green: '#3fb950',
          yellow: '#d29922',
          blue: '#58a6ff',
          magenta: '#bc8cff',
          cyan: '#39d353',
          white: '#c9d1d9',
          brightBlack: '#484f58',
          brightRed: '#f85149',
          brightGreen: '#3fb950',
          brightYellow: '#d29922',
          brightBlue: '#58a6ff',
          brightMagenta: '#bc8cff',
          brightCyan: '#39d353',
          brightWhite: '#ffffff'
        }
      });
      terminal.open(document.getElementById('terminal'));

      // Fit the terminal to the container
      fitAddon = new FitAddon.FitAddon();
      terminal.loadAddon(fitAddon);
      fitAddon.fit();
      terminal.onData(data => {
        if (socket && socket.connected) {
          socket.emit('terminal_input', { input: data });
        }
      });
      terminal.onResize(size => {
        if (socket && socket.connected) {
          socket.emit('terminal_resize', { cols: size.cols, rows: size.rows });
        }
      });

      // Refit on window resize
      window.addEventListener('resize', () => {
        if (fitAddon) {
          fitAddon.fit();
        }
      });
    }

    function initSocket() {
      socket = io();
      socket.on('connect', () => {
        sessionId = socket.id;
        // Ensure we have a stable clientId across reconnects
        try {
          clientId = localStorage.getItem('elliotClientId');
          if (!clientId) {
            clientId = ([1e7] + -1e3 + -4e3 + -8e3 + -1e11).replace(/[018]/g, c =>
              (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16)
            );
            localStorage.setItem('elliotClientId', clientId);
          }
        } catch (e) {
          // Fallback if localStorage/crypto unavailable
          clientId = sessionId;
        }
        // Register this logical client so server uses a stable room
        socket.emit('register_client', { client_id: clientId });
        updateStatus('connected', 'Connected to terminal');
        addMessage('Elliot', 'Hello! I\'m Elliot, your AI terminal assistant. You can type commands directly in the terminal or ask me to help you with tasks.', 'ai');
      });
      socket.on('disconnect', () => {
        updateStatus('disconnected', 'Disconnected from terminal');
      });
      socket.on('terminal_ready', (data) => {
        sessionId = data.session_id; // This will be clientId after registration
        updateStatus('connected', 'Terminal ready');
        // Ensure fit after connection/render
        if (fitAddon) {
          setTimeout(() => fitAddon.fit(), 0);
        }
      });
      socket.on('terminal_output', (data) => {
        if (terminal) {
          terminal.write(data.data);
        }
      });
      socket.on('terminal_error', (data) => {
        const msg = (data && (data.error || data.message)) ? (data.error || data.message) : 'Unknown terminal error';
        addMessage('System', 'Error: ' + msg, 'error');
      });
      socket.on('terminal_analysis', (data) => {
        addMessage('Elliot', data.analysis, 'analysis');
      });
      socket.on('menu_detected', (data) => {
        showMenuDialog(data.question, data.options);
      });
      socket.on('menu_auto_selected', (data) => {
        addMessage('Elliot', `Automatically selected option ${data.option}: ${data.label}`, 'analysis');
      });
    }

    function updateStatus(type, message) {
      const statusDiv = document.querySelector('.status');
      statusDiv.className = `status ${type}`;
      statusDiv.textContent = message;
    }

    function addMessage(sender, message, type = 'ai') {
      const chatMessages = document.getElementById('chat-messages');
      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${type}-message`;
      messageDiv.innerHTML = `<strong>${sender}:</strong> ${message}`;
      chatMessages.appendChild(messageDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById('chat-input');
      const message = input.value.trim();
      if (!message) return;
      addMessage('You', message, 'user');
      input.value = '';
      const loadingDiv = document.createElement('div');
      loadingDiv.className = 'message ai-message';
      loadingDiv.innerHTML = '<strong>Elliot:</strong> <span class="loading">Thinking</span>';
      document.getElementById('chat-messages').appendChild(loadingDiv);
      document.getElementById('chat-messages').scrollTop = document.getElementById('chat-messages').scrollHeight;
      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: message,
            session_id: sessionId || clientId || 'default'
          })
        });
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        const data = await response.json();
        loadingDiv.remove();
        if (data.command_executed) {
        } else if (data.response) {
          addMessage('Elliot', data.response, 'ai');
        } else if (data.error) {
          addMessage('System', 'Error: ' + data.error, 'error');
        } else {
          addMessage('System', 'No response from Elliot', 'error');
        }
      } catch (error) {
        loadingDiv.remove();
        addMessage('System', 'Error: ' + error.message, 'error');
      }
    }

    function clearTerminal() {
      if (terminal) {
        terminal.clear();
      }
    }

    async function restartProgram() {
      if (!confirm('Are you sure you want to restart the entire program? This will disconnect all sessions.')) {
        return;
      }

      try {
        addMessage('System', 'Restarting program...', 'system');
        const response = await fetch('/api/restart', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' }
        });

        if (response.ok) {
          addMessage('System', 'Restart initiated. Please wait a few seconds and refresh the page.', 'system');
          // Wait a moment then reload
          setTimeout(() => {
            window.location.reload();
          }, 2000);
        } else {
          throw new Error('Failed to restart');
        }
      } catch (error) {
        addMessage('System', 'Error restarting: ' + error.message, 'error');
      }
    }

    function showMenuDialog(question, options) {
      const chatMessages = document.getElementById('chat-messages');
      const menuDiv = document.createElement('div');
      menuDiv.className = 'message menu-message';
      menuDiv.innerHTML = `
        <strong>Menu:</strong> ${question}<br>
        <div class="menu-options" style="margin-top: 10px;">
          ${options.map(opt =>
        `<button class="menu-option-btn" onclick="selectMenuOption('${opt.value}')" style="
              display: block;
              width: 100%;
              margin: 5px 0;
              padding: 8px 12px;
              background: #21262d;
              border: 1px solid #30363d;
              color: #c9d1d9;
              border-radius: 6px;
              cursor: pointer;
              text-align: left;
              font-size: 14px;
            " onmouseover="this.style.background='#30363d'" onmouseout="this.style.background='#21262d'">
              <strong>${opt.value}.</strong> ${opt.label}
            </button>`
      ).join('')}
        </div>
      `;
      chatMessages.appendChild(menuDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function selectMenuOption(option) {
      if (socket && socket.connected) {
        socket.emit('menu_select', { option: option });
        addMessage('You', `Selected option: ${option}`, 'user');
      }
    }


    document.getElementById('chat-input').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        sendMessage();
      }
    });

    document.addEventListener('DOMContentLoaded', function () {
      initTerminal();
      initSocket();
    });
  </script>
</body>

</html>
