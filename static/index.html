<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Elliot</title>
  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css" />
  <link rel="stylesheet" href="/static/style.css" />
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>
  <div class="container">
    <div class="terminal-section">
      <div class="terminal-header">
        <div class="terminal-title">💻 Live Terminal</div>
        <div class="terminal-controls">
          <button class="control-btn" onclick="clearTerminal()">Clear</button>
          <button class="control-btn" onclick="resetTerminal()">Reset</button>
        </div>
      </div>
      <div class="terminal-container">
        <div id="terminal"></div>
      </div>
    </div>
    
    <div class="chat-section">
      <div class="chat-header">
        🤖 Elliot
      </div>
      <div class="chat-messages" id="chat-messages">
        <div class="status connecting">Connecting to terminal...</div>
      </div>
      <div class="chat-input-area">
        <div class="chat-input-container">
          <input type="text" id="chat-input" placeholder="Ask Elliot or type a command..." autocomplete="off">
          <button class="send-btn" onclick="sendMessage()">Send</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let socket;
    let terminal;
    let sessionId;
    let fitAddon;

    function initTerminal() {
      terminal = new Terminal({
        cursorBlink: true,
        fontSize: 14,
        fontFamily: 'Courier New, monospace',
        theme: {
          background: '#0d1117',
          foreground: '#c9d1d9',
          cursor: '#58a6ff',
          selection: '#30363d',
          black: '#0d1117',
          red: '#f85149',
          green: '#3fb950',
          yellow: '#d29922',
          blue: '#58a6ff',
          magenta: '#bc8cff',
          cyan: '#39d353',
          white: '#c9d1d9',
          brightBlack: '#484f58',
          brightRed: '#f85149',
          brightGreen: '#3fb950',
          brightYellow: '#d29922',
          brightBlue: '#58a6ff',
          brightMagenta: '#bc8cff',
          brightCyan: '#39d353',
          brightWhite: '#ffffff'
        }
      });
      terminal.open(document.getElementById('terminal'));

      // Fit the terminal to the container
      fitAddon = new FitAddon.FitAddon();
      terminal.loadAddon(fitAddon);
      fitAddon.fit();
      terminal.onData(data => {
        if (socket && socket.connected) {
          socket.emit('terminal_input', { input: data });
        }
      });
      terminal.onResize(size => {
        if (socket && socket.connected) {
          socket.emit('terminal_resize', { cols: size.cols, rows: size.rows });
        }
      });

      // Refit on window resize
      window.addEventListener('resize', () => {
        if (fitAddon) {
          fitAddon.fit();
        }
      });
    }

    function initSocket() {
      socket = io();
      socket.on('connect', () => {
        sessionId = socket.id;
        updateStatus('connected', 'Connected to terminal');
        addMessage('Elliot', 'Hello! I\'m Elliot, your AI terminal assistant. You can type commands directly in the terminal or ask me to help you with tasks.', 'ai');
      });
      socket.on('disconnect', () => {
        updateStatus('disconnected', 'Disconnected from terminal');
      });
      socket.on('terminal_ready', (data) => {
        sessionId = data.session_id;
        updateStatus('connected', 'Terminal ready');
        // Ensure fit after connection/render
        if (fitAddon) {
          setTimeout(() => fitAddon.fit(), 0);
        }
      });
      socket.on('terminal_output', (data) => {
        if (terminal) {
          terminal.write(data.data);
        }
      });
      socket.on('terminal_error', (data) => {
        const msg = (data && (data.error || data.message)) ? (data.error || data.message) : 'Unknown terminal error';
        addMessage('System', 'Error: ' + msg, 'error');
      });
      socket.on('terminal_analysis', (data) => {
        addMessage('Elliot', data.analysis, 'analysis');
      });
    }

    function updateStatus(type, message) {
      const statusDiv = document.querySelector('.status');
      statusDiv.className = `status ${type}`;
      statusDiv.textContent = message;
    }

    function addMessage(sender, message, type = 'ai') {
      const chatMessages = document.getElementById('chat-messages');
      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${type}-message`;
      messageDiv.innerHTML = `<strong>${sender}:</strong> ${message}`;
      chatMessages.appendChild(messageDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById('chat-input');
      const message = input.value.trim();
      if (!message) return;
      addMessage('You', message, 'user');
      input.value = '';
      const loadingDiv = document.createElement('div');
      loadingDiv.className = 'message ai-message';
      loadingDiv.innerHTML = '<strong>Elliot:</strong> <span class="loading">Thinking</span>';
      document.getElementById('chat-messages').appendChild(loadingDiv);
      document.getElementById('chat-messages').scrollTop = document.getElementById('chat-messages').scrollHeight;
      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ 
            message: message,
            session_id: sessionId || 'default'
          })
        });
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        const data = await response.json();
        loadingDiv.remove();
        if (data.command_executed) {
        } else if (data.response) {
          addMessage('Elliot', data.response, 'ai');
        } else if (data.error) {
          addMessage('System', 'Error: ' + data.error, 'error');
        } else {
          addMessage('System', 'No response from Elliot', 'error');
        }
      } catch (error) {
        loadingDiv.remove();
        addMessage('System', 'Error: ' + error.message, 'error');
      }
    }

    function clearTerminal() {
      if (terminal) {
        terminal.clear();
      }
    }

    function resetTerminal() {
      if (terminal) {
        terminal.clear();
        terminal.write('\r\n');
      }
    }


    document.getElementById('chat-input').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        sendMessage();
      }
    });

    document.addEventListener('DOMContentLoaded', function() {
      initTerminal();
      initSocket();
    });
  </script>
</body>
</html>
