<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Meet</title>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* Reset and base styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Google Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #ffffff;
            color: #3c4043;
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background-color: #ffffff;
        }

        .header-left {
            display: flex;
            align-items: center;
        }

        .google-meet-logo {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-icon {
            display: flex;
            gap: 1px;
        }

        .logo-square {
            width: 10px;
            height: 10px;
            border-radius: 1px;
        }

        .logo-square.green {
            background-color: #34a853;
        }

        .logo-square.red {
            background-color: #ea4335;
        }

        .logo-square.yellow {
            background-color: #fbbc04;
        }

        .logo-square.blue {
            background-color: #4285f4;
        }

        .logo-text {
            font-size: 22px;
            font-weight: 400;
            color: #3c4043;
        }

        .header-right {
            display: flex;
            align-items: center;
        }

        .sign-in-link {
            color: #1a73e8;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 4px;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 24px;
            gap: 60px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        /* Video Section */
        .video-section {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .video-preview {
            width: 100%;
            max-width: 500px;
            aspect-ratio: 16/9;
            background-color: #5f6368;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .no-camera-message {
            color: #ffffff;
            font-size: 16px;
            font-weight: 400;
        }

        /* Input Section */
        .input-section {
            width: 400px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .input-title {
            font-size: 24px;
            font-weight: 400;
            color: #3c4043;
            margin: 0;
        }

        .name-input-container {
            position: relative;
        }

        .name-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #dadce0;
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
            background-color: #ffffff;
            color: #3c4043;
        }

        .name-input::placeholder {
            color: #9aa0a6;
        }

        .character-counter {
            position: absolute;
            bottom: -20px;
            right: 0;
            font-size: 12px;
            color: #9aa0a6;
        }

        .join-button {
            width: 100%;
            padding: 12px 24px;
            background-color: #dadce0;
            color: #5f6368;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            font-family: inherit;
            cursor: not-allowed;
        }

        .other-ways-dropdown {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background-color: #f8f9fa;
            border: 1px solid #dadce0;
            border-radius: 8px;
            cursor: pointer;
        }

        .dropdown-text {
            font-size: 16px;
            color: #5f6368;
        }

        .dropdown-arrow {
            font-size: 12px;
            color: #5f6368;
        }

        /* Footer */
        .footer {
            padding: 24px;
            text-align: center;
            background-color: #ffffff;
        }

        .footer-text {
            font-size: 12px;
            color: #9aa0a6;
            line-height: 1.4;
        }

        .footer-link {
            color: #1a73e8;
            text-decoration: none;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
                padding: 20px 16px;
                gap: 24px;
            }
            
            .input-section {
                width: 100%;
                max-width: 400px;
            }
            
            .video-preview {
                max-width: 100%;
            }
            
            .header {
                padding: 12px 16px;
            }
            
            .footer {
                padding: 16px;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-left">
            <div class="google-meet-logo">
                <div class="logo-icon">
                    <div class="logo-square green"></div>
                    <div class="logo-square red"></div>
                    <div class="logo-square yellow"></div>
                    <div class="logo-square blue"></div>
                </div>
                <span class="logo-text">Google Meet</span>
            </div>
        </div>
        <div class="header-right">
            <a href="#" class="sign-in-link">Sign in</a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Left Section - Video Preview -->
        <div class="video-section">
            <div class="video-preview">
                <div class="no-camera-message">No camera found</div>
            </div>
        </div>

        <!-- Right Section - User Input -->
        <div class="input-section">
            <h1 class="input-title">What's your name?</h1>
            
            <div class="name-input-container">
                <input type="text" class="name-input" placeholder="Your name" maxlength="60">
                <div class="character-counter">0/60</div>
            </div>

            <button class="join-button">Ask to join</button>

            <div class="other-ways-dropdown">
                <span class="dropdown-text">Other ways to join</span>
                <span class="dropdown-arrow">▼</span>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p class="footer-text">
            By joining, you agree to the 
            <a href="#" class="footer-link">Terms of Service</a> 
            and 
            <a href="#" class="footer-link">Privacy Policy</a>. 
            System info will be sent to confirm you're not a bot.
        </p>
    </footer>
</body>
</html>
